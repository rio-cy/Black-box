name: Build Android Artifacts

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo -e "24333f8a63b1d79439037b4e12350488ee34f682\nd56f5187479451eabf01fb78af6dfcb131a6481e\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-license"
          SDKMANAGER=$(find $ANDROID_HOME/cmdline-tools -name sdkmanager -type f | head -n 1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses || true
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build APKs and AARs
        run: ./gradlew assembleDebug assembleRelease :Bcore:assembleDebug :Bcore:assembleRelease :black-reflection:assemble :compiler:assemble

      - name: Upload APKs to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Upload Bcore AARs to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bcore-aars
          path: Bcore/build/outputs/aar/*.aar
          if-no-files-found: warn

      - name: Upload Core Reflection & Compiler Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: core-libraries
          path: |
            black-reflection/build/libs/*
            black-reflection/build/outputs/*
            compiler/build/libs/*
            compiler/build/outputs/*
          if-no-files-found: ignore
